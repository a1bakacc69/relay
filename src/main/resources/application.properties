spring.application.name=Relay

# ===== 数据库配置 =====
# 这里是「本机开发」的默认值。
# 生产环境的地址、账号、口令一律由环境变量覆盖：
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# 口令故意不写在这一行 —— 它只存在于 config/application.properties（说明见文件末尾）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/relay?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root

# ===== MyBatis-Plus 配置 =====
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true

# ===== Shopify 对接配置 =====
# 店铺地址、token、API secret 都是敏感信息，绝不写在这里。
# 本机开发时放在 config/application.properties；部署时由下面三个环境变量提供：
#   SHOPIFY_STORE_URL / SHOPIFY_ACCESS_TOKEN / SHOPIFY_API_SECRET
#
# api.secret 专门用于 webhook 验签：Shopify 用它算 HMAC-SHA256，
# 和 access.token 是两把不同的钥匙，别混用。
shopify.store.url=
shopify.access.token=
shopify.api.secret=

# ===== 供应商服务地址 =====
# 本机开发指向 8081；云端由 SUPPLIER_BASE_URL 环境变量覆盖
supplier.base.url=http://localhost:8081

# ===== JWT =====
# 签名密钥绝不写在这里。线上由 JWT_SECRET 环境变量提供，
# 本地开发填在 config/application.properties（已被 .gitignore 排除）。
# 密钥至少 32 字节，不够 JwtUtil 会直接让应用启动失败 —— 这是故意的，
# 弱密钥等于没有签名保护。
jwt.expire-hours=24

# ===========================================================================
# 这个文件会被提交进 git，并且会被打成 jar 的一部分 —— 所以里面只能有
# 不敏感的内容，任何口令、token 都不许出现。
#
# 真正的密钥放在项目根目录的 config/application.properties：
#   Spring Boot 会自动加载它 —— file:./config/ 的优先级高于 classpath 里的这份；
#   而它被 .gitignore 和 .dockerignore 双双排除，既不进版本库，也不进镜像。
# ===========================================================================
server.port=${PORT:8080}